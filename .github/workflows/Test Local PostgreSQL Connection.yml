
name: Test PostgreSQL Connection

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root@123
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check PostgreSQL Readiness
        run: |
          pg_isready -h 127.0.0.1 -p 5432 -U postgres

      - name: Test PostgreSQL Connection
        env:
          PGPASSWORD: root@123
        run: |
          psql \
            -h 127.0.0.1 \
            -p 5432 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "SELECT 'Connection Successful' AS status;"

      - name: Verify Database Query
        env:
          PGPASSWORD: root@123
        run: |
          psql \
            -h 127.0.0.1 \
            -p 5432 \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "SELECT current_database(), current_user, version();"
